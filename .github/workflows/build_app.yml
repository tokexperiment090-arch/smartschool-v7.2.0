name: Build & Verify Riyo App

on:
  push:
    branches: [main, riyo-mobile-app]
    paths:
      - 'riyo_app/**'
      - '.github/workflows/build_app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'riyo_app/**'
  workflow_dispatch:

jobs:
  build-verify:
    name: Build Flutter (Android + iOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-apk
          path: riyo_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-ios
          path: riyo_app/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
