name: Build & Verify Riyo App

on:
  push:
    branches: [main, riyo-mobile-app]
    paths:
      - 'riyo_app/**'
      - '.github/workflows/build_app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'riyo_app/**'
  workflow_dispatch:

jobs:
  # ============================================================
  # Android APK — Linux runner (fast, no Xcode needed)
  # ============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riyo_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo ships lib/, assets/, pubspec.yaml only (no android/).
      # Generate android/ with the SAME Flutter version to avoid Gradle/AGP mismatches.
      - name: Stash app sources
        run: |
          mv lib /tmp/_lib
          mv assets /tmp/_assets
          mv pubspec.yaml /tmp/_pubspec.yaml
          [ -f l10n.yaml ] && mv l10n.yaml /tmp/_l10n.yaml || true
          ls -la

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml
          [ -f /tmp/_l10n.yaml ] && mv /tmp/_l10n.yaml ./l10n.yaml || true
          ls -la

      - name: Remove generated test/ and README.md
        run: |
          rm -rf test README.md || true
          ls -la

      - name: Patch Android permissions
        run: python3 tool/patch_perms.py android || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      # IMPORTANT: set -o pipefail ensures flutter's exit code is not swallowed by tee
      - name: Build APK (release)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          flutter build apk --release 2>&1 | tee build/android-build.log

      - name: Verify APK exists
        if: success()
        shell: bash
        run: |
          echo "=== Searching for APK files ==="
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ Expected APK not found at: $APK_PATH"
            echo "=== Contents of build/ ==="
            find build -type f 2>/dev/null | head -50 || echo "build/ is empty"
            exit 1
          fi
          echo "✅ APK found at: $APK_PATH"
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-apk
          path: riyo_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            riyo_app/build/android-build.log
            riyo_app/build/**/*.log
          if-no-files-found: warn

  # ============================================================
  # iOS — macOS runner (required for Xcode). Unsigned .app build.
  # ============================================================
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: riyo_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup CocoaPods
        run: sudo gem install cocoapods --no-document || pod --version

      - name: Stash app sources
        run: |
          mv lib /tmp/_lib
          mv assets /tmp/_assets
          mv pubspec.yaml /tmp/_pubspec.yaml
          [ -f l10n.yaml ] && mv l10n.yaml /tmp/_l10n.yaml || true
          ls -la

      - name: Generate iOS project
        run: flutter create --platforms=ios --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml
          [ -f /tmp/_l10n.yaml ] && mv /tmp/_l10n.yaml ./l10n.yaml || true
          ls -la

      - name: Remove generated test/ and README.md
        run: rm -rf test README.md || true

      - name: Patch iOS Info.plist
        run: python3 tool/patch_perms.py ios || true

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (release, no codesign)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          flutter build ios --release --no-codesign 2>&1 | tee build/ios-build.log

      - name: Verify iOS .app exists
        if: success()
        shell: bash
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Expected .app not found at: $APP_PATH"
            echo "=== Contents of build/ios ==="
            find build/ios -type d 2>/dev/null | head -30 || echo "build/ios is empty"
            exit 1
          fi
          echo "✅ iOS .app found at: $APP_PATH"
          ls -la build/ios/iphoneos/

      - name: Upload iOS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-ios
          path: riyo_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            riyo_app/build/ios-build.log
            riyo_app/build/**/*.log
          if-no-files-found: warn
