name: Build & Verify Riyo App

on:
  push:
    branches: [main, riyo-mobile-app]
    paths:
      - 'riyo_app/**'
      - '.github/workflows/build_app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'riyo_app/**'
  workflow_dispatch:

jobs:
  # Android APK — runs on Linux (fast, no Xcode needed).
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo ships lib/, assets/, pubspec.yaml only (no android/).
      # Generate android/ with the SAME Flutter version to avoid Gradle/AGP mismatches,
      # then restore our lib/assets/pubspec.
      - name: Stash app sources
        run: |
          mv lib /tmp/_lib && mv assets /tmp/_assets && mv pubspec.yaml /tmp/_pubspec.yaml || true
          ls -la

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml
          ls -la

      - name: Patch Android permissions (INTERNET, cleartext, network state)
        run: python3 tool/patch_perms.py android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-apk
          path: riyo_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # iOS — requires macOS + Xcode. Builds the unsigned .app (no-codesign).
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup CocoaPods
        run: sudo gem install cocoapods --no-document || pod --version

      - name: Stash app sources
        run: |
          mv lib /tmp/_lib && mv assets /tmp/_assets && mv pubspec.yaml /tmp/_pubspec.yaml || true

      - name: Generate iOS project
        run: flutter create --platforms=ios --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml

      - name: Patch iOS Info.plist (App Transport Security)
        run: python3 tool/patch_perms.py ios

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS pods
        run: cd ios && pod install && cd ..

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-ios
          path: riyo_app/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
